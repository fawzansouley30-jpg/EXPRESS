<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXPRESS - Gestion</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap nav"><a class="logo" href="index.html">EXPRESS</a><a class="admin-link" href="index.html">← Voir la boutique</a></div></header>
<main class="wrap admin"><div id="authBox"><h1>Gestion EXPRESS</h1><p class="muted">Connecte-toi pour gérer tes produits.</p><form id="authForm" class="form"><label>Email<input id="email" type="email" required></label><label>Mot de passe<input id="password" type="password" minlength="6" required></label><div class="auth-actions"><button class="btn" type="submit">Se connecter</button><button class="secondary" id="signup" type="button">Créer mon compte</button></div><p id="authMessage" class="message"></p></form></div>
<div id="dashboard" hidden><div class="dash-head"><div><h1>Mes produits</h1><p id="userEmail" class="muted"></p></div><button id="logout" class="secondary">Se déconnecter</button></div>
<form id="productForm" class="form"><label>Nom du produit<input id="name" required></label><label>Catégorie<select id="category"><option>Gadget</option><option>Accessoire</option><option>Maison</option><option>Tendance</option></select></label><label>Prix affiché (optionnel)<input id="price" placeholder="Ex. 9,99 €"></label><label>Description<textarea id="description" required></textarea></label><label>Photo du produit<input id="image" type="file" accept="image/*" required></label><label>Lien affilié AliExpress<input id="link" type="url" required placeholder="https://..."></label><button class="btn" type="submit">➕ Ajouter le produit</button><p id="productMessage" class="message"></p></form>
<h2>Produits ajoutés</h2><div id="adminProducts"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
